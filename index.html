<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Bus</title>
    
    <link rel="manifest" href="manifest.json">
    <link type="image/png" rel="icon" href="icono_bus.png">
    <link rel="apple-touch-icon" href="icono_bus.png">
    <meta name="theme-color" content="#ef4444">

    <style>
        /* SISTEMA DE TEMAS (VARIABLES CSS) */
        :root {
            --bg-color: #0f172a;          /* Oscuro: Fondo base */
            --surface-color: #1e293b;     /* Oscuro: Tarjetas y menús */
            --text-color: #f8fafc;        /* Oscuro: Texto principal */
            --text-muted: #94a3b8;       /* Oscuro: Texto secundario */
            --border-color: #334155;     /* Oscuro: Bordes */
            --accent-color: #ef4444;     /* Rojo principal para botones */
            --accent-hover: #dc2626;     
            --shadow-color: rgba(0, 0, 0, 0.3);
        }

        body.light-mode {
            --bg-color: #f8fafc;          /* Claro: Fondo base */
            --surface-color: #ffffff;     /* Claro: Tarjetas y menús */
            --text-color: #0f172a;        /* Claro: Texto principal */
            --text-muted: #64748b;       /* Claro: Texto secundario */
            --border-color: #e2e8f0;     /* Claro: Bordes */
            --accent-color: #dc2626;     
            --accent-hover: #991b1b;
            --shadow-color: rgba(15, 23, 42, 0.08);
        }

        * { 
            box-sizing: border-box; 
            transition: background-color 0.3s, color 0.3s, border-color 0.3s;
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 20px; 
            color: var(--text-color); 
            background-color: var(--bg-color); 
        }

        /* CABECERA Y CONTROLES SUPERIORES */
        .header-controls {
            width: 100%;
            max-width: 500px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .reloj-global { 
            font-size: 1.5em; 
            font-weight: 700;
            color: var(--text-color); 
            font-family: monospace;
        }

        .btn-tema {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 12px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.1em;
            box-shadow: 0 2px 5px var(--shadow-color);
        }

        /* SECCIONES APP */
        .seccion-app { 
            width: 100%; 
            max-width: 500px; 
            display: none; 
            flex-direction: column; 
            align-items: center; 
            animation: fadeIn 0.25s ease-out; 
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        /* LISTA / MENÚ PARADAS */
        .lista-menu { width: 100%; display: flex; flex-direction: column; gap: 12px; margin-top: 10px; }
        
        .item-menu { 
            background: var(--surface-color); 
            border: 1px solid var(--border-color); 
            padding: 16px 20px; 
            border-radius: 14px; 
            display: flex; 
            align-items: center; 
            box-shadow: 0 4px 6px -1px var(--shadow-color);
        }
        .item-menu-click { flex-grow: 1; display: flex; align-items: center; cursor: pointer; }
        .item-menu:hover { transform: translateY(-1px); }
        .item-menu:active { transform: scale(0.98); }
        
        .texto-item { flex-grow: 1; display: flex; flex-direction: column; margin-left: 15px; }
        .nombre-parada { font-weight: 600; font-size: 1.1em; color: var(--text-color); }
        .lineas-badge { font-size: 0.8em; margin-top: 4px; font-weight: bold; text-transform: uppercase; }

        .btn-borrar { background: none; border: none; color: #ef4444; font-size: 1.2em; cursor: pointer; padding: 10px; opacity: 0.5; }
        .btn-borrar:hover { opacity: 1; }

        /* DETALLE PARADA (TARJETA) */
        .tarjeta { 
            background-color: var(--surface-color); 
            padding: 30px; 
            border-radius: 20px; 
            box-shadow: 0 10px 25px -5px var(--shadow-color); 
            text-align: center; 
            width: 100%; 
            border: 1px solid var(--border-color); 
            margin-bottom: 20px; 
        }
        
        .linea { 
            font-size: 1.8em; 
            font-weight: 800; 
            padding: 6px 24px; 
            border-radius: 10px; 
            margin-bottom: 15px; 
            display: inline-block; 
            color: #ffffff !important;
        }
        
        .tiempo { 
            font-size: 4.5em; 
            font-weight: 800; 
            color: var(--text-color); 
            margin: 10px 0;
        }
        .minutos-texto { font-size: 0.35em; color: var(--text-muted); display: block; text-transform: uppercase; letter-spacing: 1px; }
        
        .brillo-carga { animation: pulseCarga 1s infinite alternate; color: var(--text-muted) !important; }
        @keyframes pulseCarga { from { opacity: 0.4; } to { opacity: 0.8; } }

        /* BARRA DE PROGRESO */
        .progreso-container { width: 100%; height: 6px; background: var(--border-color); border-radius: 10px; margin: 25px 0; overflow: hidden; }
        .progreso-barra { height: 100%; width: 0%; background: var(--accent-color); transition: width 1s ease-in-out; }

        .estado-bus { height: 20px; font-size: 1em; margin-bottom: 5px; color: var(--text-muted); font-weight: 500;}
        .estado-servidor { height: 15px; font-size: 0.75em; margin-top: 15px; color: var(--text-muted); opacity: 0.7; }

        /* BOTONES DE ACCIÓN ACCENTUADOS EN ROJO */
        .btn-volver { align-self: flex-start; background: var(--surface-color); border: 1px solid var(--border-color); color: var(--text-color); cursor: pointer; font-size: 0.9em; padding: 8px 16px; border-radius: 8px; margin-bottom: 15px; font-weight: 500; }
        .btn-volver:hover { background: var(--border-color); }
        
        button.btn-accion { 
            width: 100%; padding: 16px; border: none; border-radius: 12px; color: white; 
            font-size: 1.05em; font-weight: 600; cursor: pointer; 
            background: var(--accent-color);
            box-shadow: 0 4px 10px rgba(239, 68, 68, 0.25);
        } 
        button.btn-accion:hover { background: var(--accent-hover); }
        button.btn-accion:active { transform: translateY(1px); }
        button.btn-accion:disabled { opacity: 0.5; cursor: not-allowed; box-shadow: none; }

        .btn-secundario {
            background: transparent; border: 1px solid var(--border-color); color: var(--text-color); padding: 6px 14px; border-radius: 8px; font-weight: 600; font-size: 0.85em; cursor: pointer;
        }
        .btn-secundario:hover { background: var(--surface-color); }

        /* FORMULARIO */
        .formulario { display: flex; flex-direction: column; gap: 15px; width: 100%; background: var(--surface-color); padding: 25px; border-radius: 16px; border: 1px solid var(--border-color); box-shadow: 0 4px 12px var(--shadow-color); }
        .formulario input, .formulario select { padding: 12px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-color); color: var(--text-color); font-size: 1em; }
        .formulario input:focus, .formulario select:focus { border-color: var(--accent-color); outline: none; }
        .formulario input::placeholder { color: var(--text-muted); opacity: 0.6; }
        .formulario label { font-size: 0.8em; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: -10px; }

        /* CRÍTICO / AHORA */
        .urgente-rojo { color: #ef4444 !important; }
    </style>
</head>
<body>

    <div class="header-controls">
        <div id="reloj" class="reloj-global">00:00:00</div>
        <button class="btn-tema" onclick="alternarTema()" title="Cambiar modo claro/oscuro">🌓</button>
    </div>

    <div id="vista-menu" class="seccion-app" style="display: flex;">
        <div style="display: flex; justify-content: space-between; width: 100%; align-items: center; margin-bottom: 10px;">
            <h3 style="margin: 0; font-weight: 700; letter-spacing: -0.5px;">Mis Paradas</h3>
            <div style="display: flex; gap: 8px;">
                <button class="btn-secundario" onclick="compartirApp()">Compartir</button>
                <button class="btn-secundario" style="border-color: var(--accent-color); color: var(--accent-color);" onclick="mostrarFormulario()">+ Añadir</button>
            </div>
        </div>
        <div class="lista-menu" id="contenedor-paradas"></div>
    </div>

    <div id="vista-formulario" class="seccion-app">
        <button class="btn-volver" onclick="irAlMenu()">❮ Cancelar</button>
        <h3 style="align-self: flex-start; margin-top: 0; font-weight: 700;">Nueva Parada</h3>
        <div class="formulario">
            <label>Nombre personalizado</label>
            <input type="text" id="input-nombre" placeholder="Ej. Casa, Trabajo...">
            
            <label>Localidad</label>
            <input type="text" id="input-localidad" placeholder="Ej. Barcelona, Sant Just...">
            
            <label>Línea</label>
            <input type="text" id="input-linea" placeholder="Ej. V5, X30...">
            
            <label>Código de la Parada</label>
            <input type="text" id="input-codigo" placeholder="Ej. 3521">
            
            <label>Red de Autobuses</label>
            <select id="input-red">
                <option value="TMB">TMB (Buses urbanos Barcelona)</option>
                <option value="AMB">AMB (Buses metropolitanos)</option>
            </select>
            
            <button class="btn-accion" style="margin-top: 5px;" onclick="guardarParada()">Guardar Parada</button>
        </div>
    </div>

    <div id="vista-detalle" class="seccion-app">
        <button class="btn-volver" onclick="irAlMenu()">❮ Volver</button>
        <div class="tarjeta">
            <div id="detalle-codigo" style="font-size: 0.8em; font-weight: 600; color: var(--text-muted); margin-bottom: 12px; letter-spacing: 1px;">CÓDIGO --</div>
            <div id="detalle-linea" class="linea">--</div>
            <div class="tiempo" id="detalle-tiempo">--</div>
            <div class="progreso-container"><div id="detalle-barra" class="progreso-barra"></div></div>
            <div id="detalle-siguiente" class="estado-bus">Conectando...</div>
            <div id="detalle-info" class="estado-servidor"></div>
        </div>
        <button id="btn-actualizar" class="btn-accion" onclick="forzarActualizacion()">Actualizar Datos</button>
    </div>

    <script>
        // CONFIGURACIÓN API TMB
        const APP_ID = "05f36d2d"; 
        const APP_KEY = "7337db37d02d34777f38d728ce1c1903"; 

        // ESTADO GLOBAL
        let paradaActiva = null; 
        let timerActualizacion = null;

        // ASIGNACIÓN DE COLORES ADAPTADOS A LA NUEVA INTERFAZ MODERNA
        function obtenerColorLinea(linea, red) {
            const l = linea.toUpperCase();
            if (l === 'X30') return '#ea580c';      // Naranja moderno y sólido
            if (l === 'L52') return '#ca8a04';      // Amarillo/Ámbar oscuro (legible en fondo claro y oscuro)
            if (red === 'TMB') return '#0284c7';    // Azul/Cian corporativo elegante
            return '#db2777';                       // Fucsia/Rosa estilizado para resto de AMB
        }

        // SISTEMA DE CONFIGURACIÓN DE TEMA CLARO / OSCURO
        function inicializarTema() {
            const temaGuardado = localStorage.getItem('tema-preferido');
            if (temaGuardado === 'claro') {
                document.body.classList.add('light-mode');
            } else {
                document.body.classList.remove('light-mode');
            }
        }

        function alternarTema() {
            document.body.classList.toggle('light-mode');
            localStorage.setItem('tema-preferido', document.body.classList.contains('light-mode') ? 'claro' : 'oscuro');
        }

        // 1. CARGAR PARADAS DESDE STORAGE
        let misParadas = JSON.parse(localStorage.getItem('paradasGuardadas_v3'));
        if (!misParadas || misParadas.length === 0) {
            misParadas = [
                { id: 1, nombre: 'C. Bell-lloc - Berlín', linea: 'V5', codigo: '3521', red: 'TMB', localidad: 'Barcelona' },
                { id: 2, nombre: 'Pl. Reina Maria Cristina', linea: 'X30', codigo: '237', red: 'AMB', localidad: 'Barcelona' },
                { id: 3, nombre: 'Major - Mercat', linea: 'L52', codigo: '002275', red: 'AMB', localidad: "Sant Joan Despí" },
                { id: 4, nombre: 'Rosa Leveroni', linea: 'X30', codigo: '109953', red: 'AMB', localidad: 'Sant Just Desvern' }
            ];
            guardarEnMemoria();
        }

        // 2. RENDERIZAR MENÚ
        function renderizarMenu() {
            const contenedor = document.getElementById('contenedor-paradas');
            contenedor.innerHTML = ''; 
            
            misParadas.forEach(p => {
                const colorLinea = obtenerColorLinea(p.linea, p.red);
                const div = document.createElement('div');
                div.className = 'item-menu';
                div.innerHTML = `
                    <div class="item-menu-click" onclick="abrirParada(${p.id})">
                        <span style="font-size: 1.5em;">🚌</span>
                        <div class="texto-item">
                            <span class="nombre-parada">${p.nombre}</span>
                            <span style="font-size: 0.8em; color: var(--text-muted); margin-top: 2px;">🏙️ ${p.localidad}</span>
                            <span class="lineas-badge" style="color: ${colorLinea}">Línea ${p.linea} (${p.red})</span>
                        </div>
                    </div>
                    <button class="btn-borrar" onclick="borrarParada(${p.id})">✖</button>
                `;
                contenedor.appendChild(div);
            });
        }

        // 3. NAVEGACIÓN
        function irAlMenu() {
            document.querySelectorAll('.seccion-app').forEach(s => s.style.display = 'none');
            document.getElementById('vista-menu').style.display = 'flex';
            paradaActiva = null;
            if(timerActualizacion) clearInterval(timerActualizacion);
        }

        function mostrarFormulario() {
            document.querySelectorAll('.seccion-app').forEach(s => s.style.display = 'none');
            document.getElementById('vista-formulario').style.display = 'flex';
        }

        function abrirParada(id) {
            paradaActiva = misParadas.find(p => p.id === id);
            
            document.getElementById('detalle-codigo').innerText = `CÓDIGO ${paradaActiva.codigo}`;
            
            const badge = document.getElementById('detalle-linea');
            badge.innerText = paradaActiva.linea.toUpperCase();
            badge.style.backgroundColor = obtenerColorLinea(paradaActiva.linea, paradaActiva.red);

            document.querySelectorAll('.seccion-app').forEach(s => s.style.display = 'none');
            document.getElementById('vista-detalle').style.display = 'flex';
            
            buscarDatosBus();
            
            if(timerActualizacion) clearInterval(timerActualizacion);
            timerActualizacion = setInterval(buscarDatosBus, 30000);
        }

        // 4. LÓGICA STORAGE
        function guardarEnMemoria() { localStorage.setItem('paradasGuardadas_v3', JSON.stringify(misParadas)); }

        function guardarParada() {
            const nombre = document.getElementById('input-nombre').value;
            const localidad = document.getElementById('input-localidad').value || 'Desconocida';
            const linea = document.getElementById('input-linea').value;
            const codigo = document.getElementById('input-codigo').value;
            const red = document.getElementById('input-red').value;

            if(!nombre || !linea || !codigo) { alert("Por favor, rellena los campos principales."); return; }

            const nuevaParada = { id: Date.now(), nombre, linea: linea.toUpperCase(), codigo, red, localidad };
            misParadas.push(nuevaParada);
            guardarEnMemoria();
            
            document.getElementById('input-nombre').value = '';
            document.getElementById('input-localidad').value = '';
            document.getElementById('input-linea').value = '';
            document.getElementById('input-codigo').value = '';
            
            renderizarMenu();
            irAlMenu();
        }

        function borrarParada(id) {
            if(confirm("¿Seguro que quieres eliminar esta parada?")) {
                misParadas = misParadas.filter(p => p.id !== id);
                guardarEnMemoria();
                renderizarMenu();
            }
        }

        // 5. PROCESAMIENTO DE TIEMPOS
        function setEstadoCarga() {
            const tiempoEl = document.getElementById('detalle-tiempo');
            tiempoEl.classList.add('brillo-carga');
            tiempoEl.innerHTML = '--'; 
            document.getElementById('detalle-siguiente').innerText = "Cargando horarios...";
        }

        function procesarResultados(min1, min2) {
            const tiempoEl = document.getElementById('detalle-tiempo');
            const barraEl = document.getElementById('detalle-barra');
            const sigEl = document.getElementById('detalle-siguiente');
            
            tiempoEl.classList.remove('brillo-carga');
            tiempoEl.classList.remove('urgente-rojo');

            if (min1 === null || min1 === undefined || isNaN(min1)) {
                tiempoEl.innerHTML = "--"; 
                barraEl.style.width = "0%";
                sigEl.innerText = "Sin autobuses próximos registrados.";
                return;
            }

            if (min1 <= 3 && navigator.vibrate) navigator.vibrate([200, 100, 200]); 

            if (min2 !== null && min2 !== undefined && !isNaN(min2)) {
                sigEl.innerHTML = `Siguiente autobús en: <span style="font-weight: 600; color: var(--text-color);">${min2} min</span>`;
            } else {
                sigEl.innerText = "No hay más autobuses previstos.";
            }

            let porcentaje = Math.max(0, Math.min(100, 100 - (min1 * 6.6)));
            barraEl.style.width = porcentaje + "%";
            
            if (min1 === 0) { 
                tiempoEl.innerHTML = "¡AHORA!"; 
                tiempoEl.classList.add('urgente-rojo');
            } else { 
                tiempoEl.innerHTML = min1 + '<span class="minutos-texto">minutos</span>'; 
                if(min1 <= 3) tiempoEl.classList.add('urgente-rojo');
            }
        }

        async function buscarDatosBus() {
            if(!paradaActiva) return;
            setEstadoCarga();
            
            const controller = new AbortController();
            const timeoutConexion = setTimeout(() => controller.abort(), 30000);
            
            try {
                if (paradaActiva.red === 'TMB') {
                    const url = `https://api.tmb.cat/v1/ibus/stops/${paradaActiva.codigo}?app_id=${APP_ID}&app_key=${APP_KEY}`;
                    const res = await fetch(url, { signal: controller.signal });
                    const datos = await res.json();
                    const buses = datos.data?.ibus.filter(b => b.line.toUpperCase() === paradaActiva.linea) || [];
                    procesarResultados(parseInt(buses[0]?.["t-in-min"]), parseInt(buses[1]?.["t-in-min"]));
                } else {
                    const res = await fetch(`https://mi-bus.onrender.com/api/amb?parada=${paradaActiva.codigo}`, { signal: controller.signal });
                    const datos = await res.json();
                    
                    if (datos.status === "ok") {
                        const buses = datos.buses.filter(b => b.linea.toUpperCase().includes(paradaActiva.linea));
                        
                        let minAMB1 = buses[0]?.minutos !== undefined ? parseInt(buses[0].minutos) : null;
                        let minAMB2 = buses[1]?.minutos !== undefined ? parseInt(buses[1].minutos) : null;

                        procesarResultados(minAMB1, minAMB2);
                    } else throw new Error("AMB Error");
                }
                document.getElementById('detalle-info').innerText = "Conexión estable con el consorcio";
            } catch (e) {
                document.getElementById('detalle-info').innerText = e.name === 'AbortError' ? "⚠️ Servidor lento o inactivo" : "⚠️ Error de red";
                procesarResultados(null, null);
            } finally {
                clearTimeout(timeoutConexion);
            }
        }

        async function forzarActualizacion() {
            const btn = document.getElementById('btn-actualizar');
            btn.innerText = "Sincronizando..."; 
            btn.disabled = true;
            try {
                await buscarDatosBus();
            } finally {
                setTimeout(() => { btn.innerText = "Actualizar Datos"; btn.disabled = false; }, 600);
            }
        }

        async function compartirApp() {
            if (navigator.share) {
                try {
                    await navigator.share({
                        title: 'Mi Bus',
                        text: 'Consulta los tiempos de llegada del bus fácilmente.',
                        url: window.location.href 
                    });
                } catch (e) {}
            } else {
                alert('Copia este enlace para compartir:\n' + window.location.href);
            }
        }

        // RELOJ DIGITAL
        function actualizarReloj() {
            const ahora = new Date();
            const relojEl = document.getElementById('reloj');
            if(relojEl) {
                relojEl.innerText = ahora.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            }
        }
        
        // EJECUCIÓN AL INICIAR
        window.onload = () => {
            inicializarTema();
            renderizarMenu();
            actualizarReloj();
            setInterval(actualizarReloj, 1000);
        };
    </script>
</body>
</html>
